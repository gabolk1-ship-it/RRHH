version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: rrhh-postgres
    environment:
      POSTGRES_USER: rrhh_user
      POSTGRES_PASSWORD: rrhh_password_dev
      POSTGRES_DB: rrhh_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rrhh_user -d rrhh_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rrhh_network

  # Optional: pgAdmin para ver la BD visualmente
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: rrhh-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@hospital.ec
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - rrhh_network

volumes:
  postgres_data:

networks:
  rrhh_network:
    driver: bridge
